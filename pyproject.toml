[tool.poetry]
name = "production-ml-platform"
version = "0.1.0"
description = "Portfolio-ready production ML platform monorepo"
authors = ["Tech Lead <techlead@example.com>"]
readme = "README.md"
packages = [{ include = "shared" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.2"
mlflow = "^2.17.0"
feast = "^0.40.0"
scikit-learn = "^1.5.2"
pandas = "^2.2.3"
numpy = ">=1.22,<2.0"
python-json-logger = "^2.0.7"
prometheus-client = "^0.21.0"
pyyaml = "^6.0.2"
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
black = "^24.10.0"
mypy = "^1.11.2"
pre-commit = "^3.8.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
