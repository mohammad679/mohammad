name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "1.8.4"

      - name: Install dependencies
        run: poetry install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  docker-build-integration:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build serving image
        run: docker build -f serving/Dockerfile -t production-ml-platform-serving:ci .

      - name: Validate compose config
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config

      - name: Integration test (compose)
        run: bash scripts/integration_test.sh

  deploy-smoke-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-build-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy prod profile
        run: docker compose --env-file .env.example -f infra/docker-compose.yml --profile prod up -d --build

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml --profile prod down -v
