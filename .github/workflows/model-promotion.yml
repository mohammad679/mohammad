name: model-promotion-gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  promote-if-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "1.8.4"

      - name: Install dependencies
        run: poetry install

      - name: Validate promotion threshold logic
        run: poetry run pytest tests/test_training_validation.py -q

      - name: Attempt promotion
        env:
          PROMOTION_MIN_F1: "0.90"
        run: |
          echo "Promotion workflow expects trained model + MLflow availability in target environment"
          poetry run python training/scripts/promote_model.py || true
